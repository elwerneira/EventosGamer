<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Explorar eventos')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="contenido" class="content-page">
    <div class="page-heading"><p class="eyebrow">Elige tu próximo encuentro</p><h1>Tu próxima<br>conexión<span class="accent">.</span></h1><p class="muted">Busca por categoría, fecha y ciudad. Nos vemos en la próxima partida.</p></div>
    <form class="filters" th:action="@{/eventos}" method="get" aria-label="Filtrar eventos">
        <div><label for="category">Categoría</label><select id="category" name="category"><option value="">Todas las categorías</option><option th:each="item : ${categories}" th:value="${item}" th:text="${item}" th:selected="${item == category}"></option></select></div>
        <div><label for="date">Fecha</label><input id="date" name="date" type="date" th:value="${date}"></div>
        <div><label for="location">Ubicación</label><select id="location" name="location"><option value="">Todas las ciudades</option><option th:each="item : ${locations}" th:value="${item}" th:text="${item}" th:selected="${item == location}"></option></select></div>
        <button class="button" type="submit">Buscar ↗</button><a th:href="@{/eventos}">Limpiar filtros</a>
    </form>
    <p class="result-count" role="status" th:text="${#lists.size(events)} + ' evento(s) encontrado(s)'"></p>
    <div class="cards"><th:block th:each="event : ${events}"><article th:replace="~{fragments :: card(${event})}"></article></th:block></div>
    <div th:if="${#lists.isEmpty(events)}" class="empty"><h2>No hay coincidencias</h2><p>Prueba con otra fecha, categoría o ubicación.</p><a class="text-link" th:href="@{/eventos}">Ver todos los eventos →</a></div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
