<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Mi perfil')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="contenido" class="form-page">
    <section class="form-intro">
        <p class="eyebrow">Tu identidad en GREEGAME</p><h1>Juega<br>a tu manera<span class="accent">.</span></h1>
        <div class="profile-preview"><span class="avatar" th:switch="${form.avatar}" aria-label="Avatar seleccionado"><span th:case="'mago'">✦</span><span th:case="'piloto'">➤</span><span th:case="'guerrero'">◆</span><span th:case="*">◎</span></span><div><strong th:text="${form.displayName}"></strong><p class="muted" th:text="${#authentication.name}"></p></div></div>
        <p>Elige tu avatar y cuéntanos qué juegos te gustan.</p>
        <p class="eyebrow" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">Administrador · GREEGAME</p>
    </section>
    <section class="panel" aria-labelledby="profile-title">
        <h2 id="profile-title">Mi perfil</h2><p th:if="${param.saved}" class="message" role="status">Tu perfil se guardó correctamente.</p>
        <form th:action="@{/perfil}" th:object="${form}" method="post" class="stack">
            <div th:if="${#fields.hasAnyErrors()}" class="message error" role="alert"><ul><li th:each="error : ${#fields.allErrors()}" th:text="${error}"></li></ul></div>
            <div><label for="displayName">Nombre de usuario</label><input id="displayName" th:field="*{displayName}" autocomplete="nickname" required maxlength="40" th:attr="aria-invalid=${#fields.hasErrors('displayName')}"></div>
            <div><label for="games">Juegos de interés</label><textarea id="games" th:field="*{games}" required maxlength="160" rows="3" placeholder="Por ejemplo: Valorant, Minecraft, Street Fighter" th:attr="aria-invalid=${#fields.hasErrors('games')}"></textarea></div>
            <div><label for="avatar">Avatar</label><select id="avatar" th:field="*{avatar}" required><option value="explorador">◎ Explorador</option><option value="mago">✦ Mago</option><option value="piloto">➤ Piloto</option><option value="guerrero">◆ Guerrero</option></select></div>
            <label class="checkbox"><input type="checkbox" th:field="*{notifications}"> Quiero recibir novedades de eventos.</label>
            <p class="hint">Se guarda tu preferencia de notificaciones. El envío de correos estará disponible más adelante.</p>
            <button class="button" type="submit">Guardar perfil →</button>
        </form>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
